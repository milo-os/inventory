version: "2"
run:
  timeout: 5m
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: lax
    rules:
      - linters: [errcheck]
        text: Error return value of `fmt\.Fprint(f|ln)` is not checked
      - linters: [staticcheck]
        text: 'SA1019: sigs\.k8s\.io/controller-runtime/pkg/scheme\.Builder is deprecated'
      - linters: [staticcheck]
        text: 'SA1019: sigs\.k8s\.io/controller-runtime/pkg/client\.Apply is deprecated'
    paths:
      - third_party$
      - builtin$
