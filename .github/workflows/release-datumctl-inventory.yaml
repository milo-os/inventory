name: Release datumctl-inventory plugin

# Releases the datumctl-inventory CLI plugin only — not the operator image.
# Triggered by tags of the form datumctl-inventory/vX.Y.Z so plugin releases
# are decoupled from operator versions. The operator's publish.yaml ignores
# these tags and skips the matching release event.

on:
  push:
    tags:
      - 'datumctl-inventory/v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Syft CLI
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Strip the datumctl-inventory/ tag prefix so goreleaser derives the
      # plugin's own version instead of the repo's latest (operator) tag.
      - name: Resolve plugin version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#datumctl-inventory/}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean -f .goreleaser.datumctl-inventory.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.ver.outputs.version }}
