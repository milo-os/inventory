name: Publish Inventory

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
    # datumctl-inventory plugin releases use their own tag prefix and are
    # built by release-datumctl-inventory.yaml — they must not rebuild the
    # operator image.
    tags-ignore:
      - 'datumctl-inventory/**'

  release:
    types: ['published']

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

  publish-container-image:
    # Skip when the triggering release is a plugin release (see tags-ignore above
    # for the push path). On push/branch events github.event.release is empty, so
    # this evaluates true and the operator still publishes as before.
    if: ${{ !startsWith(github.event.release.tag_name, 'datumctl-inventory/') }}
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.15.0
    with:
      image-name: inventory
      registry-organization: milo-os
    secrets: inherit

  publish-kustomize-bundles:
    # Add explicit dependency so that the kustomize bundles only get published
    # if the container image has been built successfully. This helps prevent
    # situations where the deployment manifests are picked up by flux but the
    # container is still being created.
    needs: [publish-container-image]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.15.0
    with:
      bundle-name: ghcr.io/milo-os/inventory-kustomize
      bundle-path: config
      image-overlays: config/base/manager
      image-name: ghcr.io/milo-os/inventory
    secrets: inherit
