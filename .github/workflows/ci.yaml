name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.26.0
    with:
      skip: test
      run: |
        go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
        assets=$("$(go env GOPATH)/bin/setup-envtest" use 1.34.1 -p path)
        KUBEBUILDER_ASSETS="$assets" go test -timeout 5m ./... -count=1
