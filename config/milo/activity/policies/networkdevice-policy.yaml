apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: inventory.miloapis.com-networkdevice
spec:
  resource:
    apiGroup: inventory.miloapis.com
    kind: NetworkDevice
  auditRules:
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.requestObject.spec.siteRef)"
      summary: "{{ actor }} created NetworkDevice {{ link(audit.objectRef.name, audit.objectRef) }} at site {{ audit.requestObject.spec.siteRef.name }}"
    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create'"
      summary: "{{ actor }} created {{ link('a NetworkDevice', audit.objectRef) }}"
    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.requestObject.spec)"
      summary: "{{ actor }} updated NetworkDevice {{ link(audit.objectRef.name, audit.objectRef) }}"
    - name: update-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource)"
      summary: "{{ actor }} updated {{ link('a NetworkDevice', audit.objectRef) }}"
    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete'"
      summary: "{{ actor }} deleted NetworkDevice {{ audit.objectRef.name }}"
  eventRules:
    - name: ready
      match: "has(event.metadata.annotations) && event.metadata.annotations['inventory.miloapis.com/event-type'] == 'inventory.networkdevice.ready'"
      summary: "Inventory NetworkDevice {{ link(event.metadata.annotations['inventory.miloapis.com/display-name'], event.regarding) }} is ready"
    - name: not-ready
      match: "has(event.metadata.annotations) && event.metadata.annotations['inventory.miloapis.com/event-type'] == 'inventory.networkdevice.not_ready'"
      summary: "Inventory NetworkDevice {{ link(event.metadata.annotations['inventory.miloapis.com/display-name'], event.regarding) }} is not ready: {{ event.note }}"
