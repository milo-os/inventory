apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: inventory.miloapis.com-provider
spec:
  resource:
    apiGroup: inventory.miloapis.com
    kind: Provider
  auditRules:
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.requestObject.spec.displayName)"
      summary: "{{ actor }} registered Provider {{ link(audit.requestObject.spec.displayName, audit.objectRef) }}"
    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create'"
      summary: "{{ actor }} registered {{ link('a Provider', audit.objectRef) }}"
    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.requestObject.spec) && has(audit.requestObject.spec.displayName)"
      summary: "{{ actor }} updated Provider {{ link(audit.requestObject.spec.displayName, audit.objectRef) }}"
    - name: update-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource)"
      summary: "{{ actor }} updated {{ link('a Provider', audit.objectRef) }}"
    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseObject.spec) && has(audit.responseObject.spec.displayName)"
      summary: "{{ actor }} deleted Provider {{ audit.responseObject.spec.displayName }}"
    - name: delete-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete'"
      summary: "{{ actor }} deleted Provider {{ audit.objectRef.name }}"
  eventRules:
    - name: ready
      match: "has(event.metadata.annotations) && event.metadata.annotations['inventory.miloapis.com/event-type'] == 'inventory.provider.ready'"
      summary: "Inventory Provider {{ link(event.metadata.annotations['inventory.miloapis.com/display-name'], event.regarding) }} is ready"
    - name: not_ready
      match: "has(event.metadata.annotations) && event.metadata.annotations['inventory.miloapis.com/event-type'] == 'inventory.provider.not_ready'"
      summary: "Inventory Provider {{ link(event.metadata.annotations['inventory.miloapis.com/display-name'], event.regarding) }} is not ready: {{ event.note }}"
