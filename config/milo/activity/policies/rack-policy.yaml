apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: inventory.miloapis.com-rack
spec:
  resource:
    apiGroup: inventory.miloapis.com
    kind: Rack
  auditRules:
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.requestObject.spec.siteRef) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created Rack {{ link(audit.objectRef.name, audit.objectRef) }} at site {{ audit.requestObject.spec.siteRef.name }}"
    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created {{ link('a Rack', audit.objectRef) }}"
    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.requestObject) && type(audit.requestObject) == map && has(audit.requestObject.spec) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated Rack {{ link(audit.objectRef.name, audit.objectRef) }}"
    - name: update-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated {{ link('a Rack', audit.objectRef) }}"
    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} deleted Rack {{ audit.objectRef.name }}"
  eventRules:
    - name: ready
      match: "has(event.metadata.annotations) && event.metadata.annotations['inventory.miloapis.com/event-type'] == 'inventory.rack.ready'"
      summary: "Inventory Rack {{ link(event.metadata.annotations['inventory.miloapis.com/display-name'], event.regarding) }} is ready"
    - name: not-ready
      match: "has(event.metadata.annotations) && event.metadata.annotations['inventory.miloapis.com/event-type'] == 'inventory.rack.not_ready'"
      summary: "Inventory Rack {{ link(event.metadata.annotations['inventory.miloapis.com/display-name'], event.regarding) }} is not ready: {{ event.note }}"
