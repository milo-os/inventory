apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: inventory.miloapis.com-site
spec:
  resource:
    apiGroup: inventory.miloapis.com
    kind: Site
  auditRules:
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.requestObject.spec.displayName) && has(audit.requestObject.spec.regionRef)"
      summary: "{{ actor }} created Site {{ link(audit.requestObject.spec.displayName, audit.objectRef) }} in region {{ audit.requestObject.spec.regionRef.name }}"
    - name: create-named
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.requestObject.spec.displayName)"
      summary: "{{ actor }} created Site {{ link(audit.requestObject.spec.displayName, audit.objectRef) }}"
    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create'"
      summary: "{{ actor }} created {{ link('a Site', audit.objectRef) }}"
    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.requestObject.spec) && has(audit.requestObject.spec.displayName)"
      summary: "{{ actor }} updated Site {{ link(audit.requestObject.spec.displayName, audit.objectRef) }}"
    - name: update-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource)"
      summary: "{{ actor }} updated {{ link('a Site', audit.objectRef) }}"
    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseObject.spec) && has(audit.responseObject.spec.displayName)"
      summary: "{{ actor }} deleted Site {{ audit.responseObject.spec.displayName }}"
    - name: delete-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete'"
      summary: "{{ actor }} deleted Site {{ audit.objectRef.name }}"
  eventRules:
    - name: ready
      match: "has(event.metadata.annotations) && event.metadata.annotations['inventory.miloapis.com/event-type'] == 'inventory.site.ready'"
      summary: "Inventory Site {{ link(event.metadata.annotations['inventory.miloapis.com/display-name'], event.regarding) }} is ready"
    - name: not-ready
      match: "has(event.metadata.annotations) && event.metadata.annotations['inventory.miloapis.com/event-type'] == 'inventory.site.not_ready'"
      summary: "Inventory Site {{ link(event.metadata.annotations['inventory.miloapis.com/display-name'], event.regarding) }} is not ready: {{ event.note }}"
