apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: inventory.miloapis.com-node
spec:
  resource:
    apiGroup: inventory.miloapis.com
    kind: Node
  auditRules:
    - name: create-placed
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.requestObject.spec.placement) && has(audit.requestObject.spec.placement.rackRef)"
      summary: "{{ actor }} placed Node {{ link(audit.objectRef.name, audit.objectRef) }} in rack {{ audit.requestObject.spec.placement.rackRef.name }}"
    - name: create-sited
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.requestObject.spec.siteRef)"
      summary: "{{ actor }} created Node {{ link(audit.objectRef.name, audit.objectRef) }} at site {{ audit.requestObject.spec.siteRef.name }}"
    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create'"
      summary: "{{ actor }} created {{ link('a Node', audit.objectRef) }}"
    - name: update-assigned
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.requestObject.spec) && has(audit.requestObject.spec.assignment) && has(audit.requestObject.spec.assignment.clusterRef)"
      summary: "{{ actor }} assigned Node {{ link(audit.objectRef.name, audit.objectRef) }} to cluster {{ audit.requestObject.spec.assignment.clusterRef.name }}"
    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.requestObject.spec)"
      summary: "{{ actor }} updated Node {{ link(audit.objectRef.name, audit.objectRef) }}"
    - name: update-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource)"
      summary: "{{ actor }} updated {{ link('a Node', audit.objectRef) }}"
    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete'"
      summary: "{{ actor }} deleted Node {{ audit.objectRef.name }}"
  eventRules:
    - name: ready
      match: "has(event.metadata.annotations) && event.metadata.annotations['inventory.miloapis.com/event-type'] == 'inventory.node.ready'"
      summary: "Inventory Node {{ link(event.metadata.annotations['inventory.miloapis.com/display-name'], event.regarding) }} is ready"
    - name: not-ready
      match: "has(event.metadata.annotations) && event.metadata.annotations['inventory.miloapis.com/event-type'] == 'inventory.node.not_ready'"
      summary: "Inventory Node {{ link(event.metadata.annotations['inventory.miloapis.com/display-name'], event.regarding) }} is not ready: {{ event.note }}"
