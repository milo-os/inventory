apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This base bundle is not intended to be applied directly — it pins the
# controller to the `inventory-system` namespace and wires in the webhook
# cert-manager Certificate via kustomize replacements. Consumers should
# prefer `config/overlays/dev` (or equivalent) for runtime variations.
namespace: inventory-system

resources:
  - crd
  - manager
  - certmanager

components:
  - webhook

replacements:
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: inventory-serving-cert
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 0
          create: true
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: inventory-serving-cert
      fieldPath: .metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 1
          create: true
  - source:
      kind: Service
      version: v1
      name: inventory-webhook
      fieldPath: .metadata.name
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: inventory-serving-cert
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 0
  - source:
      kind: Service
      version: v1
      name: inventory-webhook
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: inventory-serving-cert
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 1
