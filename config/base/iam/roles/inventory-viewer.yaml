    - inventory.miloapis.com/racks.watch
    - inventory.miloapis.com/clusters.get
    - inventory.miloapis.com/clusters.list
    - inventory.miloapis.com/clusters.watch
    - inventory.miloapis.com/nodes.get
    - inventory.miloapis.com/nodes.list
    - inventory.miloapis.com/nodes.watch
    - inventory.miloapis.com/networkdevices.get
    - inventory.miloapis.com/networkdevices.list
    - inventory.miloapis.com/networkdevices.watch
    - inventory.miloapis.com/ports.get
    - inventory.miloapis.com/ports.list
