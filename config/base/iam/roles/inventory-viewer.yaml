    - inventory.miloapis.com/circuits.watch
    - inventory.miloapis.com/virtualmachines.get
    - inventory.miloapis.com/virtualmachines.list
    - inventory.miloapis.com/virtualmachines.watch
    - inventory.miloapis.com/links.get
    - inventory.miloapis.com/links.list
    - inventory.miloapis.com/links.watch
