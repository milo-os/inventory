---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: racks.inventory.miloapis.com
spec:
  group: inventory.miloapis.com
  names:
    kind: Rack
    listKind: RackList
    plural: racks
    singular: rack
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.siteRef.name
      name: Site
      type: string
    - jsonPath: .spec.cage
      name: Cage
      type: string
    - jsonPath: .spec.row
      name: Row
      type: string
    - jsonPath: .spec.heightU
      name: HeightU
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Rack is the Schema for the racks API. A Rack belongs to exactly one Site and
          is the mount point for placed Nodes and NetworkDevices.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RackSpec defines the desired state of Rack. Cage and row are modeled as
              free-form attributes rather than their own kinds to avoid kind explosion.
            properties:
              cage:
                description: Cage is the free-form cage identifier within the Site.
                type: string
              heightU:
                description: |-
                  HeightU is the number of mountable rack units (U) the rack provides.
                  Devices placed in the rack occupy unit positions 1..HeightU.
                format: int32
                minimum: 1
                type: integer
              name:
                description: Name is a human-readable name for the rack (e.g. its
                  asset label).
                type: string
              powerFeeds:
                description: PowerFeeds enumerates the power feeds delivered to the
                  rack.
                items:
                  description: RackPowerFeed describes a single power feed delivered
                    to a Rack.
                  properties:
                    ampsRated:
                      description: AmpsRated is the rated current of the feed in amperes.
                      format: int32
                      minimum: 1
                      type: integer
                    name:
                      description: Name identifies the feed (e.g. "A", "B").
                      minLength: 1
                      type: string
                    phase:
                      description: Phase is the electrical phase configuration of
                        the feed.
                      enum:
                      - SinglePhase
                      - ThreePhase
                      type: string
                    voltage:
                      description: Voltage is the nominal feed voltage in volts.
                      format: int32
                      minimum: 1
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              row:
                description: Row is the free-form row identifier within the cage.
                type: string
              siteRef:
                description: |-
                  SiteRef references the Site this Rack physically lives in. This field is
                  immutable after creation.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - heightU
            - siteRef
            type: object
            x-kubernetes-validations:
            - message: siteRef is immutable
              rule: self.siteRef == oldSelf.siteRef
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for reconciliation
                reason: Pending
                status: "False"
                type: Ready
            description: RackStatus defines the observed state of Rack.
            properties:
              conditions:
                description: |-
                  Represents the observations of a rack's current state.
                  Known condition types are: "Ready".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
