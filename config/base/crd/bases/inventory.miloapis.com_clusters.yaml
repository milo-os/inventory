---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: clusters.inventory.miloapis.com
spec:
  group: inventory.miloapis.com
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.controlPlaneSiteRef.name
      name: CP-Site
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster is the Schema for the clusters API. A Cluster's control plane
          lives at exactly one Site (controlPlaneSiteRef). Workers (Nodes) and
          NetworkDevices belonging to the cluster may be at other Sites; the
          cluster's full geographic footprint is derived from those child assets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec defines the desired state of Cluster.
            properties:
              controlPlaneSiteRef:
                description: |-
                  ControlPlaneSiteRef references the Site hosting this cluster's
                  Kubernetes control plane (i.e. where the API server lives). Worker
                  nodes and network devices belonging to this cluster may be at other
                  sites; a cluster's overall footprint is derived from its Nodes and
                  NetworkDevices, not from this field. Immutable after creation.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              displayName:
                description: DisplayName is a human-readable name for the cluster.
                minLength: 1
                type: string
              endpoint:
                description: |-
                  Endpoint is an optional API server URL for the cluster. When set it
                  must be an http:// or https:// URL.
                pattern: ^https?://.+$
                type: string
              provider:
                description: |-
                  Provider is a free-form identifier for the system that provisioned or
                  manages the cluster, for example "sidero-omni" or "gke". The inventory
                  does not interpret this string.
                minLength: 1
                type: string
              role:
                description: Role classifies the Cluster.
                enum:
                - Compute
                - Management
                - Edge
                - Gateway
                type: string
            required:
            - controlPlaneSiteRef
            - displayName
            - provider
            - role
            type: object
            x-kubernetes-validations:
            - message: controlPlaneSiteRef is immutable
              rule: self.controlPlaneSiteRef == oldSelf.controlPlaneSiteRef
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for reconciliation
                reason: Pending
                status: "False"
                type: Ready
            description: ClusterStatus defines the observed state of Cluster.
            properties:
              conditions:
                description: |-
                  Represents the observations of a cluster's current state.
                  Known condition types are: "Ready".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
