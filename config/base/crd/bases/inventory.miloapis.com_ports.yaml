---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: ports.inventory.miloapis.com
spec:
  group: inventory.miloapis.com
  names:
    kind: Port
    listKind: PortList
    plural: ports
    singular: port
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deviceRef.kind
      name: Device-Kind
      type: string
    - jsonPath: .spec.deviceRef.name
      name: Device
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.speed
      name: Speed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Port is the Schema for the ports API. A Port is a connection point exposed
          by a Node, NetworkDevice, or Rack-mounted device, and is the near/far-end
          identifier a Cable connects.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PortSpec defines the desired state of Port.
            properties:
              deviceRef:
                description: |-
                  DeviceRef references the device that exposes this Port. This field is
                  immutable after creation.
                properties:
                  kind:
                    description: Kind of the device exposing the port.
                    enum:
                    - Node
                    - NetworkDevice
                    - Rack
                    type: string
                  name:
                    description: Name of the referenced device.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              name:
                description: |-
                  Name identifies the Port on its device (e.g. "eth0", "PSU1",
                  "pp-A-24").
                minLength: 1
                type: string
              speed:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Speed is the nominal line rate of a network Port, expressed as a
                  Kubernetes Quantity (e.g. "10G", "400G"). Unset for non-network ports.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              type:
                description: Type classifies the Port.
                enum:
                - Power
                - Serial
                - Ethernet
                - Optical
                - PatchPanel
                type: string
            required:
            - deviceRef
            - name
            - type
            type: object
            x-kubernetes-validations:
            - message: deviceRef is immutable
              rule: self.deviceRef == oldSelf.deviceRef
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for reconciliation
                reason: Pending
                status: "False"
                type: Ready
            description: PortStatus defines the observed state of Port.
            properties:
              conditions:
                description: |-
                  Represents the observations of a port's current state.
                  Known condition types are: "Ready".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
