---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: circuits.inventory.miloapis.com
spec:
  group: inventory.miloapis.com
  names:
    kind: Circuit
    listKind: CircuitList
    plural: circuits
    singular: circuit
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.name
      name: Provider
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.circuitID
      name: CircuitID
      type: string
    - jsonPath: .spec.bandwidthMbps
      name: Mbps
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Circuit is the Schema for the circuits API. A Circuit records a network
          circuit — cross-connect, provider circuit, transit, or peering — delivered
          by a Provider between two endpoints, optionally linked to a platform
          service in another API group.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CircuitSpec defines the desired state of Circuit.
            properties:
              aEnd:
                description: AEnd is the A-side termination of the Circuit.
                properties:
                  kind:
                    description: Kind of the inventory object this end terminates
                      on.
                    enum:
                    - Site
                    - Port
                    type: string
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              bandwidthMbps:
                description: |-
                  BandwidthMbps is the Circuit's provisioned bandwidth in megabits per
                  second.
                format: int64
                minimum: 1
                type: integer
              circuitID:
                description: CircuitID is the provider's circuit / LOA identifier.
                type: string
              providerRef:
                description: |-
                  ProviderRef references the Provider that delivers this Circuit. This
                  field is immutable after creation.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              serviceRef:
                description: |-
                  ServiceRef optionally links this Circuit to a platform resource in
                  another API group (e.g. a networking Galactic VPC uplink).
                properties:
                  apiGroup:
                    description: APIGroup of the referenced resource (e.g. "networking.miloapis.com").
                    minLength: 1
                    type: string
                  kind:
                    description: Kind of the referenced resource.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the referenced resource.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the referenced resource, for namespaced
                      targets.
                    type: string
                required:
                - apiGroup
                - kind
                - name
                type: object
              type:
                description: Type classifies the Circuit.
                enum:
                - CrossConnect
                - ProviderCircuit
                - Transit
                - Peering
                type: string
              zEnd:
                description: ZEnd is the Z-side termination of the Circuit.
                properties:
                  kind:
                    description: Kind of the inventory object this end terminates
                      on.
                    enum:
                    - Site
                    - Port
                    type: string
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - aEnd
            - providerRef
            - type
            - zEnd
            type: object
            x-kubernetes-validations:
            - message: providerRef is immutable
              rule: self.providerRef == oldSelf.providerRef
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for reconciliation
                reason: Pending
                status: "False"
                type: Ready
            description: CircuitStatus defines the observed state of Circuit.
            properties:
              conditions:
                description: |-
                  Represents the observations of a circuit's current state.
                  Known condition types are: "Ready", "EndpointsResolved".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
