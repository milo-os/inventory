---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: providers.inventory.miloapis.com
spec:
  group: inventory.miloapis.com
  names:
    kind: Provider
    listKind: ProviderList
    plural: providers
    singular: provider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Provider is the Schema for the providers API. A Provider records an
          infrastructure provider relationship (hosting, colo, transit, IX, dark
          fiber, cloud) and has no parent references.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProviderSpec defines the desired state of Provider.
            properties:
              contract:
                description: Contract optionally records contract metadata.
                properties:
                  accountID:
                    description: AccountID is the operator's account identifier with
                      the provider.
                    type: string
                  contractID:
                    description: ContractID is the provider's contract or agreement
                      identifier.
                    type: string
                  notes:
                    description: Notes is free-form contract context.
                    type: string
                  portalURL:
                    description: |-
                      PortalURL is an optional link to the provider's management portal.
                      When set it must be an http:// or https:// URL.
                    pattern: ^https?://.+$
                    type: string
                type: object
              displayName:
                description: DisplayName is a human-readable name for the provider.
                minLength: 1
                type: string
              serviceIdentifiers:
                description: |-
                  ServiceIdentifiers is an optional list of named identifiers the
                  provider assigns to services.
                items:
                  description: |-
                    ServiceIdentifier is a named identifier the provider assigns to a service
                    (e.g. {"ASN","64512"}, {"LOA-CFA","..."}). The inventory does not
                    interpret these; they are queryable metadata.
                  properties:
                    identifier:
                      description: Identifier is the value the provider assigned.
                      minLength: 1
                      type: string
                    name:
                      description: Name is the identifier's label (e.g. "ASN", "LOA-CFA").
                      minLength: 1
                      type: string
                  required:
                  - identifier
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              type:
                description: Type classifies the provider relationship.
                enum:
                - Hosting
                - Colocation
                - Transit
                - InternetExchange
                - DarkFiber
                - Cloud
                type: string
            required:
            - displayName
            - type
            type: object
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for reconciliation
                reason: Pending
                status: "False"
                type: Ready
            description: ProviderStatus defines the observed state of Provider.
            properties:
              conditions:
                description: |-
                  Represents the observations of a provider's current state.
                  Known condition types are: "Ready".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
