---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: cables.inventory.miloapis.com
spec:
  group: inventory.miloapis.com
  names:
    kind: Cable
    listKind: CableList
    plural: cables
    singular: cable
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.media
      name: Media
      type: string
    - jsonPath: .spec.endpoints[0].name
      name: A
      type: string
    - jsonPath: .spec.endpoints[1].name
      name: Z
      type: string
    - jsonPath: .spec.lengthM
      name: Length
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Cable is the Schema for the cables API. A Cable is the physical run between
          two Ports.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CableSpec defines the desired state of Cable. A Cable records the physical
              run between exactly two Ports — the near-end and far-end. It is distinct
              from the logical Link, which records connectivity/capacity between assets;
              a Link may reference the Cable(s) that realize it.
            properties:
              endpoints:
                description: |-
                  Endpoints are the two Ports this Cable connects. The two endpoints must
                  reference different Ports.
                items:
                  description: |-
                    LocalObjectReference is a reference to another cluster-scoped object in the
                    inventory.miloapis.com API group by name. All inventory cross-resource
                    references use this type rather than raw strings so that CRD schemas are
                    explicit about intent.
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 2
                minItems: 2
                type: array
                x-kubernetes-list-type: atomic
              label:
                description: Label is a free-form operator label for the run (e.g.
                  its sticker).
                type: string
              lengthM:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  LengthM is the cable length in meters, expressed as a Kubernetes
                  Quantity (e.g. "3", "0.5").
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              media:
                description: Media classifies the physical medium.
                enum:
                - Copper
                - FiberSMF
                - FiberMMF
                - Power
                - DAC
                type: string
            required:
            - endpoints
            - media
            type: object
            x-kubernetes-validations:
            - message: cable endpoints must be distinct
              rule: self.endpoints[0].name != self.endpoints[1].name
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for reconciliation
                reason: Pending
                status: "False"
                type: Ready
            description: CableStatus defines the observed state of Cable.
            properties:
              conditions:
                description: |-
                  Represents the observations of a cable's current state.
                  Known condition types are: "Ready", "EndpointsResolved".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
