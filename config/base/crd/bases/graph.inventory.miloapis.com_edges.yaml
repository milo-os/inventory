---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: edges.graph.inventory.miloapis.com
spec:
  group: graph.inventory.miloapis.com
  names:
    kind: Edge
    listKind: EdgeList
    plural: edges
    singular: edge
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.from.name
      name: From
      type: string
    - jsonPath: .spec.to.name
      name: To
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          Edge is a directed relationship between two graph Nodes. Its relationship
          class is given by spec.type and its descriptive data by spec.attributes. It
          supersedes the v1alpha1 Link/Cable/Circuit kinds and the inline parent refs.
          See RFC milo-os/inventory#43.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EdgeSpec defines the desired state of a graph Edge.
            properties:
              attributes:
                additionalProperties:
                  type: string
                description: |-
                  Attributes is the edge's key/value attribute bag. The admission webhook
                  validates these against the matching EdgeType's attribute schema.
                type: object
              from:
                description: From is the source endpoint Node.
                properties:
                  name:
                    description: Name of the referenced Node.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              to:
                description: To is the target endpoint Node.
                properties:
                  name:
                    description: Name of the referenced Node.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              type:
                description: |-
                  Type names the relationship class. The value must match the name of an
                  existing EdgeType, which constrains the endpoint node types and the
                  attributes this edge may carry. Typical values: located-in, member-of,
                  mounted-in, connects, realized-by, provided-by. This field is immutable.
                minLength: 1
                type: string
            required:
            - from
            - to
            - type
            type: object
            x-kubernetes-validations:
            - message: type is immutable
              rule: self.type == oldSelf.type
            - message: edge endpoints must be distinct
              rule: self.from != self.to
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for reconciliation
                reason: Pending
                status: "False"
                type: Ready
            description: EdgeStatus defines the observed state of a graph Edge.
            properties:
              conditions:
                description: |-
                  Represents the observations of an edge's current state.
                  Known condition types are: "Ready", "EndpointsResolved".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
