---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: nodes.inventory.miloapis.com
spec:
  group: inventory.miloapis.com
  names:
    kind: Node
    listKind: NodeList
    plural: nodes
    singular: node
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.siteRef.name
      name: Site
      type: string
    - jsonPath: .spec.assignment.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.assignment.role
      name: Role
      type: string
    - jsonPath: .spec.hardware.cpuArchitecture
      name: Arch
      type: string
    - jsonPath: .spec.hardware.cpuCores
      name: CPU
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Node is the Schema for the nodes API. A Node is a physical or virtual
          machine that physically lives in a Site and may optionally be assigned to
          a Cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeSpec defines the desired state of Node.
            properties:
              addresses:
                description: Addresses is the list of reachable addresses for the
                  Node.
                items:
                  description: NodeAddress is a single reachable address for a Node.
                  properties:
                    address:
                      description: Address is the IP address or hostname.
                      minLength: 1
                      type: string
                    type:
                      description: Type classifies the address.
                      enum:
                      - Internal
                      - External
                      - Hostname
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              assignment:
                description: |-
                  Assignment optionally records the Cluster this Node is a member of.
                  When unset the Node is considered unassigned.
                properties:
                  clusterRef:
                    description: ClusterRef references the Cluster the Node is assigned
                      to.
                    properties:
                      name:
                        description: Name of the referenced object.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  role:
                    description: Role is the Node's role within the referenced Cluster.
                    enum:
                    - ControlPlane
                    - Worker
                    type: string
                required:
                - clusterRef
                - role
                type: object
              hardware:
                description: Hardware describes the Node's physical capabilities.
                properties:
                  cpuArchitecture:
                    description: CPUArchitecture identifies the CPU instruction set.
                    enum:
                    - amd64
                    - arm64
                    type: string
                  cpuCores:
                    description: CPUCores is the total number of logical CPU cores
                      available on the node.
                    format: int32
                    minimum: 1
                    type: integer
                  disks:
                    description: Disks is the list of disks attached to the node.
                    items:
                      description: NodeDisk describes a single disk attached to a
                        Node.
                      properties:
                        name:
                          description: Name identifies the disk (e.g. device name
                            or asset label).
                          minLength: 1
                          type: string
                        sizeBytes:
                          description: SizeBytes is the total raw capacity of the
                            disk in bytes.
                          format: int64
                          minimum: 1
                          type: integer
                        type:
                          description: Type classifies the disk media.
                          enum:
                          - SSD
                          - HDD
                          - NVMe
                          type: string
                      required:
                      - name
                      - sizeBytes
                      - type
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  memoryBytes:
                    description: MemoryBytes is the total RAM on the node in bytes.
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - cpuArchitecture
                - cpuCores
                - memoryBytes
                type: object
              placement:
                description: |-
                  Placement optionally records where the Node is physically mounted in a
                  Rack. A validating webhook enforces fit and non-overlap.
                properties:
                  face:
                    default: Front
                    description: Face is the rack face the device is mounted on. Defaults
                      to Front.
                    enum:
                    - Front
                    - Rear
                    type: string
                  rackRef:
                    description: RackRef references the Rack this device is mounted
                      in.
                    properties:
                      name:
                        description: Name of the referenced object.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  startUnit:
                    description: |-
                      StartUnit is the lowest rack unit (U) the device occupies, counting from
                      1 at the bottom of the rack.
                    format: int32
                    minimum: 1
                    type: integer
                  unitHeight:
                    description: UnitHeight is the number of contiguous units the
                      device occupies.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - rackRef
                - startUnit
                - unitHeight
                type: object
              siteRef:
                description: |-
                  SiteRef references the Site where this Node physically lives. This
                  field is immutable after creation.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - hardware
            - siteRef
            type: object
            x-kubernetes-validations:
            - message: siteRef is immutable
              rule: self.siteRef == oldSelf.siteRef
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for reconciliation
                reason: Pending
                status: "False"
                type: Ready
            description: NodeStatus defines the observed state of Node.
            properties:
              conditions:
                description: |-
                  Represents the observations of a node's current state.
                  Known condition types are: "Ready".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              phase:
                description: |-
                  Phase is a coarse lifecycle indicator derived from the Node's
                  assignment and readiness.
                enum:
                - Unassigned
                - Assigned
                - Unavailable
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
