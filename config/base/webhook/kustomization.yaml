apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
# manifests.yaml is generated by controller-gen and should NOT be edited
# directly — `task manifests` will overwrite it. The patches below rewrite
# the hardcoded names that controller-gen produces so the rest of the bundle
# can use static `inventory-*` references.
- manifests.yaml

# Teach kustomize about the webhook clientConfig.service.{name,namespace}
# field paths so the namespace transform handles them automatically.
configurations:
- kustomizeconfig.yaml

patches:
# Rewrite the names controller-gen emits so the rest of the bundle can use
# static `inventory-*` references.
- patch: |-
    - op: replace
      path: /metadata/name
      value: inventory-validating
    - op: replace
      path: /webhooks/0/clientConfig/service/name
      value: inventory-webhook
    - op: replace
      path: /webhooks/0/clientConfig/service/namespace
      value: inventory-system
    - op: replace
      path: /webhooks/1/clientConfig/service/name
      value: inventory-webhook
    - op: replace
      path: /webhooks/1/clientConfig/service/namespace
      value: inventory-system
    - op: replace
      path: /webhooks/2/clientConfig/service/name
      value: inventory-webhook
    - op: replace
      path: /webhooks/2/clientConfig/service/namespace
      value: inventory-system
    - op: replace
      path: /webhooks/3/clientConfig/service/name
      value: inventory-webhook
    - op: replace
      path: /webhooks/3/clientConfig/service/namespace
      value: inventory-system
    - op: replace
      path: /webhooks/4/clientConfig/service/name
      value: inventory-webhook
    - op: replace
      path: /webhooks/4/clientConfig/service/namespace
      value: inventory-system
    - op: replace
      path: /webhooks/5/clientConfig/service/name
      value: inventory-webhook
    - op: replace
      path: /webhooks/5/clientConfig/service/namespace
      value: inventory-system
    - op: replace
      path: /webhooks/6/clientConfig/service/name
      value: inventory-webhook
    - op: replace
      path: /webhooks/6/clientConfig/service/namespace
      value: inventory-system
    - op: replace
      path: /webhooks/7/clientConfig/service/name
      value: inventory-webhook
    - op: replace
      path: /webhooks/7/clientConfig/service/namespace
      value: inventory-system
    - op: replace
      path: /webhooks/8/clientConfig/service/name
      value: inventory-webhook
    - op: replace
      path: /webhooks/8/clientConfig/service/namespace
      value: inventory-system
    - op: replace
      path: /webhooks/9/clientConfig/service/name
      value: inventory-webhook
    - op: replace
      path: /webhooks/9/clientConfig/service/namespace
      value: inventory-system
  target:
    kind: ValidatingWebhookConfiguration
    name: validating-webhook-configuration
