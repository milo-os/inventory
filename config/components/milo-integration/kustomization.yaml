apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# milo-integration wires the inventory controller into a Milo control plane:
#
#   - Mounts the datum-control-plane-trust-bundle ConfigMap (populated by
#     trust-manager) so the controller can verify Milo's server certificate.
#   - Mounts a client certificate issued by the datum-control-plane
#     ClusterIssuer for authenticating to Milo.
#   - Replaces the base webhook-cert Secret volume with a cert-manager CSI
#     volume, also issued by the datum-control-plane ClusterIssuer.
#   - Mounts a Milo kubeconfig ConfigMap that tells the controller how
#     to reach Milo. Consumers must provide this ConfigMap (named
#     inventory-milo-kubeconfig) in the inventory-system namespace.
#
# Consumers also need to ensure the inventory-system namespace has the label
# `infra.datum.net/inject-datum-control-plane-trust-bundle: ""` so that
# trust-manager populates the trust bundle ConfigMap.
#
# This component contains only the controller's Milo-wiring patches. The
# inventory ActivityPolicy resources are NOT installed here: they require the
# activity.miloapis.com CRDs served only by the Milo control plane's
# activity-system apiserver, and this component is consumed by the infra
# cluster (which has no such CRDs). The policies live in config/milo and are
# applied directly to the Milo control plane by a dedicated Flux Kustomization.

patches:
  # Remove the base Secret-based webhook-cert volume and volumeMount so we
  # can replace them cleanly with a cert-manager CSI volume below. A
  # strategic merge of same-named volumes would produce an invalid spec
  # with both secret and csi fields set.
  - target:
      kind: Deployment
      name: inventory-controller-manager
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/0
      - op: remove
        path: /spec/template/spec/volumes/0
  # Add the Milo-specific volumes, volumeMounts, and the CSI-based webhook
  # cert that replaces the removed Secret-based one.
  - target:
      kind: Deployment
      name: inventory-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inventory-controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: KUBECONFIG
                    value: /etc/kubernetes/project-discovery/auth/milo-kubeconfig.yaml
                  - name: LEADER_ELECT_NAMESPACE
                    value: milo-system
                  # POD_NAME stamps the ReportingInstance on emitted activity
                  # Events so operators can trace which replica reported a
                  # transition.
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                volumeMounts:
                  - mountPath: /etc/kubernetes/pki/trust
                    name: trust-bundle
                    readOnly: true
                  - mountPath: /tmp/k8s-webhook-server/serving-certs
                    name: webhook-cert
                    readOnly: true
                  - mountPath: /etc/kubernetes/projects/pki/client
                    name: client-cert
                    readOnly: true
                  - mountPath: /etc/kubernetes/project-discovery/auth
                    name: milo-kubeconfig
                    readOnly: true
            volumes:
              - name: trust-bundle
                configMap:
                  name: datum-control-plane-trust-bundle
              - name: milo-kubeconfig
                configMap:
                  name: inventory-milo-kubeconfig
              - name: webhook-cert
                csi:
                  driver: csi.cert-manager.io
                  readOnly: true
                  volumeAttributes:
                    csi.cert-manager.io/common-name: inventory-webhook
                    csi.cert-manager.io/fs-group: "65532"
                    csi.cert-manager.io/issuer-kind: ClusterIssuer
                    csi.cert-manager.io/issuer-name: datum-control-plane
                    csi.cert-manager.io/dns-names: inventory-webhook.inventory-system.svc,inventory-webhook.inventory-system.svc.cluster.local
              - name: client-cert
                csi:
                  driver: csi.cert-manager.io
                  readOnly: true
                  volumeAttributes:
                    csi.cert-manager.io/common-name: system:control@inventory.miloapis.com
                    csi.cert-manager.io/fs-group: "65532"
                    csi.cert-manager.io/issuer-kind: ClusterIssuer
                    csi.cert-manager.io/issuer-name: datum-control-plane
                    csi.cert-manager.io/key-usages: client auth
                    csi.cert-manager.io/organizations: system:masters
